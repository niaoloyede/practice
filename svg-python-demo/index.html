<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG animation (Python-served, no JS libraries)</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #020617;
        font-family: system-ui, sans-serif;
        color: #e2e8f0;
      }
      main {
        text-align: center;
        padding: 1.5rem;
      }
      object {
        display: block;
        margin: 0 auto 1rem;
        max-width: min(92vw, 480px);
        height: auto;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }
      p {
        max-width: 40rem;
        margin: 0 auto;
        line-height: 1.5;
        font-size: 0.95rem;
        color: #94a3b8;
      }
      code {
        font-size: 0.85em;
        padding: 0.15em 0.4em;
        border-radius: 6px;
        background: #1e293b;
      }
    </style>
  </head>
  <body>
    <main>
      <object data="animation.svg" type="image/svg+xml" width="480" height="480" aria-label="Animated SVG">
        <p>Your browser cannot display this SVG object. Open <code>animation.svg</code> directly.</p>
      </object>
      <p>
        Animation is <strong>SVG + CSS only</strong> (no GSAP, Framer Motion, or React). Serve with
        <code>python3 server.py</code> then open the printed URL.
      </p>
    </main>
  </body>
</html>
